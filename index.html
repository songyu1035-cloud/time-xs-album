<!DOCTYPE html><html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171512">
  <title>TIME XS · 私密相册</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #171512;
      color: #f8f0e5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      padding: 32px 18px 22px;
      text-align: center;
      border-bottom: 1px solid #393129;
    }
    h1 {
      margin: 0;
      font: 32px Georgia, serif;
      letter-spacing: 5px;
    }
    header p { color: #c8b8a2; font-size: 14px; }
    main {
      max-width: 760px;
      margin: 30px auto;
      padding: 0 18px;
    }
    .panel {
      padding: 24px;
      background: #211e1a;
      border: 1px solid #493c2f;
      border-radius: 16px;
    }
    h2 { margin-top: 0; font-size: 21px; }
    input, button {
      width: 100%;
      min-height: 48px;
      margin-top: 12px;
      border-radius: 9px;
      font-size: 16px;
    }
    input {
      padding: 12px;
      color: white;
      background: #171512;
      border: 1px solid #655342;
    }
    button {
      padding: 12px;
      border: 0;
      background: #d7b78a;
      color: #21180e;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    .secondary {
      background: transparent;
      color: #e4d2b9;
      border: 1px solid #655342;
    }
    #message, #albumMessage {
      line-height: 1.7;
      color: #e4cda9;
      overflow-wrap: anywhere;
    }
    #gallery {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 18px;
    }
    #gallery img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 10px;
      border: 1px solid #493c2f;
    }
    .hidden { display: none !important; }
    footer {
      padding: 25px 15px;
      text-align: center;
      color: #9f917f;
      font-size: 12px;
    }
    @media (max-width: 420px) {
      #gallery { grid-template-columns: 1fr; }
      .panel { padding: 18px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>TIME XS</h1>
    <p>珍藏每一个值得记住的瞬间</p>
  </header>  <main>
    <section id="loginPanel" class="panel">
      <h2>进入我们的私密相册</h2>
      <p>输入相册密码，开启珍藏回忆。</p>
      <form id="loginForm">
        <input id="password" type="password"
          placeholder="请输入相册密码"
          autocomplete="current-password" required>
        <button id="loginButton" type="submit">登录相册</button>
      </form>
      <p id="message" role="status" aria-live="polite"></p>
    </section><section id="albumPanel" class="hidden">
  <div class="panel">
    <h2>我们的珍藏时光</h2>
    <p id="albumMessage">等待登录……</p>
    <button id="refreshButton" class="secondary" type="button">
      刷新照片
    </button>
    <button id="logoutButton" class="secondary" type="button">
      退出登录
    </button>
  </div>
  <div id="gallery"></div>
</section>

  </main>  <footer>TIME XS · 私密珍藏 · 永恒回忆</footer>  <script>
    "use strict";

    const API_URL =
      "https://qtbuxfnigveinknogplb.supabase.co/functions/v1/time-xs-access";

    let sessionToken = "";

    const $ = (id) => document.getElementById(id);

    async function api(action, data = {}) {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          ...(sessionToken
            ? { "Authorization": "Bearer " + sessionToken }
            : {})
        },
        body: JSON.stringify({ action, ...data })
      });

      const result = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(
          result.error || result.message ||
          "服务器请求失败（HTTP " + response.status + "）"
        );
      }

      return result;
    }

    $("loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();

      const password = $("password").value;
      $("loginButton").disabled = true;
      $("message").textContent = "正在验证密码……";

      try {
        const result = await api("login", { password });

        if (result.success !== true) {
          throw new Error(result.error || "密码验证未成功");
        }

        sessionToken = result.token ||
          result.sessionToken || result.session_token || "";

        if (!sessionToken) {
          throw new Error("登录成功，但服务器没有返回会话令牌。");
        }

        $("password").value = "";
        $("loginPanel").classList.add("hidden");
        $("albumPanel").classList.remove("hidden");

        await loadPhotos();
      } catch (error) {
        $("message").textContent =
          "登录失败：" + error.message;
      } finally {
        $("loginButton").disabled = false;
      }
    });

     async function loadPhotos() {
  $("albumMessage").textContent = "正在加载照片……";
  $("gallery").replaceChildren();
  $("refreshButton").disabled = true;

  try {
    const result = await api("list");

    if (result.success !== true || !Array.isArray(result.files)) {
      throw new Error(result.error || "读取照片列表失败");
    }

    if (result.files.length === 0) {
      $("albumMessage").textContent = "相册里暂时没有照片。";
      return;
    }

    let count = 0;

    for (const file of result.files) {
      if (!file.name) continue;

      try {
        const signed = await api("sign", { path: file.name });
        const url = signed.signedUrl;

        if (!signed.success || !url) continue;

        const img = document.createElement("img");
        img.src = url;
        img.alt = file.name;
        img.loading = "lazy";

        img.onerror = () => {
          img.alt = "照片加载失败，请刷新相册";
        };

        $("gallery").appendChild(img);
        count++;
      } catch (error) {
        console.error("照片签名失败：", file.name, error);
      }
    }

    $("albumMessage").textContent = count > 0
      ? "已加载 " + count + " 张照片。"
      : "没有成功加载照片，请检查存储桶中的文件。";

  } catch (error) {
    $("albumMessage").textContent =
      "照片加载失败：" + error.message;
  } finally {
    $("refreshButton").disabled = false;
  }
      }  
        

        let count = 0;

        for (const file of files) {
          const url = typeof file === "string"
            ? file
            : file.url || file.signedUrl ||
              file.signed_url || file.publicUrl;

          if (typeof url !== "string" ||
              !/^https?:\/\//i.test(url)) {
            continue;
          }

          const img = document.createElement("img");
          img.src = url;
          img.alt = "TIME XS 婚礼照片";
          img.loading = "lazy";
          img.onerror = () => {
            img.alt = "照片加载失败，请刷新重试";
          };

          $("gallery").appendChild(img);
          count++;
        }

        $("albumMessage").textContent = count
          ? "已显示 " + count + " 张照片。"
          : "暂时没有可显示的照片地址。";
      } catch (error) {
        $("albumMessage").textContent =
          "照片加载失败：" + error.message;
      } finally {
        $("refreshButton").disabled = false;
      }
    }

    $("refreshButton").addEventListener("click", loadPhotos);

    $("logoutButton").addEventListener("click", () => {
      sessionToken = "";
      $("gallery").replaceChildren();
      $("albumPanel").classList.add("hidden");
      $("loginPanel").classList.remove("hidden");
      $("message").textContent = "已退出登录。";
      $("password").value = "";
    });
  </script></body>
</html>
